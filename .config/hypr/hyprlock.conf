general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor = eDP-1
    path = ~/.cache/current_wallpaper
    blur_size = 5
    blur_passes = 2
}

input-field {
    monitor = eDP-1
    size = 200, 50
    outline_thickness = 1
    rounding = 20
    dots_size = 0.3
    dots_spacing = 0.4
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text =
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    hide_input = false

    font_color = rgba(3D9ECBff)
    capslock_color = rgba(3D9ECBff)
    numlock_color = rgba(3D9ECBff)
    bothlock_color = rgba(3D9ECBff)
    inner_color = rgba(1A1A2255)
    outer_color = rgba(538D9Fee) rgba(328BC9ee) 45deg
    check_color = rgba(3D9ECBee)
    fail_color = rgba(BED1D9ee)

    position = 0, -40
    halign = center
    valign = center
}

# TIME
label {
    monitor = eDP-1
    text = $TIME
    font_size = 40
    font_family = MesloLGLDZNerdFont

    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor = eDP-1
    text = Hi! $USER
    color = rgba(BED1D9ee)
    font_size = 20
    font_family = MesloLGLDZNerdFont
    position = 0, 50
    halign = center
    valign = center
}
