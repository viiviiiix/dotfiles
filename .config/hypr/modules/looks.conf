general {
    gaps_in = 3
    gaps_out = 10
    border_size = 2
    resize_on_border = false

    col.active_border = rgb(21819F) rgb(147FC9) rgb(3056AB) rgb(1892CB) rgb(396CD3) rgb(3899C4) 45deg
    col.inactive_border = rgba(454450ee)

    allow_tearing = false  # https://wiki.hypr.land/Configuring/Tearing
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 0.8
    inactive_opacity = 0.8

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 6
        passes = 4

        vibrancy = 0.1696
    }
}
